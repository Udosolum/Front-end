  <body>
    <style>
      * {
        box-sizing: border-box;
        margin: 0px;
        padding: 0px;
      }

      .form {
        margin: auto;
        background-color: rgb(226, 222, 216);
        padding: 30px;
      }
      h2 {
        margin-bottom: 10px;
        
      }
      .f, .s{
        color: blue;
      }
      .button{
        padding:5px;
        margin: 10px;
      }
      .button-d{
        background-color: blue;
        color:aliceblue;
        padding:5px;
        font-family: "Nunito";
         &:hover{
                transform:scale(.9)
      }
    }
      span{
        font-family: "Nunito";
        color: blue;

      }
      .container{
        border-radius:5px;
        margin-top: 20px;
      }
    </style>

    <div class="form container w-50">
      <section class=" ">
        <div class="text-center fs-xl f"><i class="fa-brands fa-facebook-f"></i>acebook</div>
        <h2 class="text-center s ">Sign in</h2>
        <div class="">
            <span class="fs-sm">Email Address </span> 
            <input type="text"placeholder="    *****@gmail.com"class="border-0 rounded p-2 w-100 email" />
        </div>
        <div class="" id="password">
            <span class="fs-sm pass">Enter your password </span> <br />
            <input type="text" class="border-0 rounded p-2 w-100 " id="pass" />
            <button type="button" class="btn btn-link" onclick="showNewPass()">Forgot Password?</button>
        </div>
        <div id="message"> </div>
        <div class="d-none npass">
            <span class="fs-sm"> New password </span>
            <input type="text" class="border-0 rounded p-2 w-100 " id="newpass">
            <br>
            <span class="fs-sm"> Confirm Password </span>
            <input type="text" class="border-0 rounded p-2 w-100 " id="conpass">
        </div>
        

        <div class="button text-center"><button class="border-0 rounded p-3 button-d w-50"  type="submit" onclick="checkPass()" id="signinButton"> Sign in Now</button></div>
        <div class=" text-center"> By clicking on "Sign in Now" you agree to <a href=""> Terms of service| Privacy policy</a></div>

        


      </section>
    </div>
  </body>

  <script>
    let password = "WONDERFUL" 
    function checkPass(){
        let pass = document.querySelector("#pass").value
        if (pass != password){
            label= document.querySelector(".pass")
            label.textContent = ` Please enter correct password`
            label.style.color = "red"
        }
        

    }

    function otpGen(){
      let otp = Math.floor( 1000 + (Math.random() * 9999))
      document.querySelector("#message").innerHTML = `
      <div class="alert alert-success" role="alert">
  Your OTP is ${otp}
</div>`
      return otp
    }

    function showNewPass(){


      hidePass = document.querySelector("#password")
      hidePass.className = "d-none"
        let newPass = document.querySelector(".npass")
        newPass.className = " npass"

    

    }

    function checkpass2(){  
      let conpass = document.querySelector("#conpass").value
      let newpass = document.querySelector("#newpass").value  
      if(conpass != newpass){
          Swal.fire({
              icon: "error",
              title: "PASSWORDS DO NOT MATCH",
              text: "Please enter the same password in both fields.",
              confirmButtonText: "Try Again"
          });
        
          }
    }
      
    

  document.querySelector('#signinButton').addEventListener("click", checkpass2)
    
    
  </script>
